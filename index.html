<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Calendar & Gym Premium</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://png.pngtree.com/png-clipart/20240629/original/pngtree-google-calendar-calendar-icon-vector-png-image_15443322.png" type="image/png">
<link rel="apple-touch-icon" href="https://png.pngtree.com/png-clipart/20240629/original/pngtree-google-calendar-calendar-icon-vector-png-image_15443322.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
  /* Variabili per Tema Chiaro e Scuro */
  :root {
    --primary: #7C3AED;
    --bg: #F3F4F6; 
    --card-bg: #ffffff;
    --text-main: #374151; 
    --border-color: #D1D5DB; 
    --grid-border: #6B7280;
    --modal-bg: #ffffff;
    --toolbar-bg: rgba(255, 255, 255, 0.85);
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    --radius: 20px;
    
    --header-bg: #ffffff;
    --empty-bg: #F3F4F6;
    --weekend-bg: #F9FAFB;
    --weekend-text: #111827;
    --default-cell-bg: #ffffff;
    --default-text: #111827;

    /* Variabili Gym (Adattate al tema scuro di default per la palestra) */
    --gym-bg: #0a0a0a;
    --gym-group-1: #151515;
    --gym-group-2: #1e1e1e;
    --gym-primary: #00e676;
    --gym-text: #f0f0f0;
    --gym-muted: #888888;
    --gym-danger: #ff5252;
    --gym-border: #333;
  }

  body.dark-mode {
    --primary: #8B5CF6;
    --bg: #111827;
    --card-bg: #1F2937;
    --text-main: #E5E7EB;
    --border-color: #4B5563; 
    --grid-border: #4B5563;
    --modal-bg: #1F2937;
    --toolbar-bg: rgba(31, 41, 55, 0.85);
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);

    --header-bg: #000000; 
    --empty-bg: #000000;
    --weekend-bg: #000000; 
    --weekend-text: #ffffff; 
    --default-cell-bg: #ffffff; 
    --default-text: #111827; 
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { background: var(--bg); color: var(--text-main); padding: 1rem; padding-top: 80px; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s; }

  /* Login Screen */
  #loginScreen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .login-card { background: var(--card-bg); padding: 40px 30px; border-radius: 24px; box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border-color); }
  .login-card h2 { margin-bottom: 8px; color: var(--primary); font-weight: 700; }
  .login-card p { margin-bottom: 24px; font-size: 14px; color: var(--text-main); opacity: 0.8; }
  .login-input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg); color: var(--text-main); font-size: 15px; outline: none; transition: border 0.2s; }
  .login-input:focus { border-color: var(--primary); }
  .login-btn { width: 100%; padding: 14px; border-radius: 12px; background: var(--primary); color: white; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
  .error-msg { color: #E74C3C; font-size: 13px; margin-top: 10px; min-height: 20px; }

  #appContent { display: none; }

  /* Toolbar */
  .toolbar { position: fixed; top: 0; left: 0; right: 0; background: var(--toolbar-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 12px; z-index: 100; border-bottom: 1px solid var(--border-color); }
  select, button { height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
  button:active { transform: scale(0.96); }
  button.undo-btn { background: #F59E0B; color: white; border: none; font-weight: 600; }
  button.today-btn { background: var(--primary); color: white; border: none; font-weight: 600; }
  button.gym-btn { background: #0a0a0a; color: #00e676; border: 1px solid #00e676; font-weight: 700; }
  button.logout-btn { background: #E74C3C; color: white; border: none; font-weight: 600; }

  /* Grid e Cards */
  .cal-grid { display: flex; flex-direction: column; gap: 35px; align-items: center; margin-top: 10px; }
  .month-block { background: var(--default-cell-bg); width: 100%; max-width: 900px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--grid-border); scroll-margin-top: 80px; }
  .month-header { padding: 16px; font-size: 18px; font-weight: 600; text-align: center; color: var(--primary); background: var(--header-bg); border-bottom: 1px solid var(--grid-border); transition: background 0.3s; }
  .days-header { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--primary); border-bottom: 1px solid var(--grid-border); }
  .day-name { text-align: center; font-size: 11px; font-weight: 600; color: white; padding: 10px 0; text-transform: uppercase; letter-spacing: 0.5px; }

  .week-row, .note-row { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cell { border-right: 1px solid var(--grid-border); cursor: pointer; overflow: hidden; transition: filter 0.2s; }
  .cell:hover { filter: brightness(0.95); }
  .week-row .cell:last-child, .note-row .cell:last-child { border-right: none; }
  .cell.empty { background: var(--empty-bg) !important; cursor: default; transition: background 0.3s; }

  .day-cell { height: 38px; border-bottom: 1px solid var(--grid-border); display: flex; align-items: center; justify-content: center; transition: background 0.3s; }
  .day-num { font-weight: 600; font-size: 17px; } 

  .note-cell { height: 95px; border-bottom: 1px solid var(--grid-border); font-size: 11px; font-weight: 500; text-align: left; padding: 6px; display: block; line-height: 1.4; transition: background 0.3s; overflow-y: auto; }
  .note-cell::-webkit-scrollbar { width: 4px; }
  .note-cell::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
  
  .today-ring { position: relative; }
  .today-ring::after { content: ''; position: absolute; inset: -1px; border: 3px solid var(--primary); border-radius: 4px; pointer-events: none; z-index: 10; }
  .cell.selected { position: relative; }
  .cell.selected::after { content: ''; position: absolute; inset: 0; background-color: rgba(124, 58, 237, 0.2); border: 2px solid var(--primary); pointer-events: none; z-index: 5; }

  /* Modal Base */
  .modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; visibility: hidden; transition: all 0.2s ease; }
  .modal-bg.active { opacity: 1; visibility: visible; }
  .modal { background: var(--modal-bg); border-radius: 24px; padding: 24px; width: 350px; max-width: 90vw; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); transform: translateY(20px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--border-color); }
  .modal-bg.active .modal { transform: translateY(0); }
  textarea { width: 100%; height: 90px; margin: 15px 0; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); resize: none; font-size: 15px; font-weight: 500; transition: border-color 0.2s; background: var(--bg); color: var(--text-main); }
  textarea:focus { border-color: var(--primary); outline: none; background: var(--card-bg); }
  .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .color-opt { height: 42px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; font-weight: 600; border: 1px solid var(--border-color); transition: transform 0.1s; }
  .color-opt:active { transform: scale(0.92); }
  .btn-save { width: 100%; background: var(--primary); color: white; padding: 14px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: 0.5px; }

  /* -------------------
     MODULO GYM (Overlay)
     ------------------- */
  #gymOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: var(--gym-bg); color: var(--gym-text);
    z-index: 3000; overflow-y: auto; padding-bottom: 120px;
    display: none; flex-direction: column;
  }
  #gymOverlay.active { display: flex; }
  
  .gym-header { background-color: var(--gym-group-1); padding: 15px 10px; text-align: center; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--gym-border); display: flex; flex-direction: column; gap: 10px; }
  .gym-title-row { display: flex; justify-content: space-between; align-items: center; }
  .gym-header h1 { font-size: 1.2rem; color: var(--gym-primary); margin: 0; }
  .close-gym-btn { background: var(--gym-danger); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  
  .gym-tabs { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
  .gym-tab-btn { background: transparent; color: var(--gym-muted); border: 1px solid var(--gym-border); padding: 6px 12px; border-radius: 15px; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
  .gym-tab-btn.active { background-color: var(--gym-primary); color: var(--gym-bg); border-color: var(--gym-primary); font-weight: bold; }

  .gym-container { padding: 10px; max-width: 600px; margin: 0 auto; width: 100%; }
  .gym-day-content { display: none; }
  .gym-day-content.active { display: block; animation: fade 0.2s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .gym-exercise-group { border-radius: 8px; margin-bottom: 12px; overflow: hidden; border: 1px solid var(--gym-border); border-left: 4px solid var(--gym-muted); }
  .gym-exercise-group:nth-child(odd) { background-color: var(--gym-group-1); }
  .gym-exercise-group:nth-child(even) { background-color: var(--gym-group-2); }
  .gym-group-header { font-size: 0.7rem; text-transform: uppercase; padding: 2px 8px; background: rgba(0,0,0,0.3); color: var(--gym-muted); text-align: right; border-bottom: 1px solid var(--gym-border); }

  .gym-exercise-item { display: flex; align-items: center; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: opacity 0.3s; }
  .gym-exercise-item:last-child { border-bottom: none; }
  .gym-exercise-item.done { opacity: 0.4; }
  .gym-exercise-item.done .gym-ex-name { text-decoration: line-through; }

  .gym-checkbox-wrapper { margin-right: 10px; }
  .gym-checkbox-wrapper input { display: none; }
  .gym-checkbox-wrapper label { width: 24px; height: 24px; border: 2px solid var(--gym-muted); border-radius: 6px; display: inline-block; cursor: pointer; position: relative; }
  .gym-checkbox-wrapper input:checked + label { background-color: var(--gym-primary); border-color: var(--gym-primary); }
  .gym-checkbox-wrapper input:checked + label::after { content: '✓'; position: absolute; color: var(--gym-bg); font-weight: bold; font-size: 16px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

  .gym-ex-info { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
  .gym-ex-name { font-weight: 600; font-size: 1rem; color: #fff; }
  .gym-ex-stats { display: flex; gap: 10px; font-size: 0.8rem; }
  .gym-ex-stats > span { color: var(--gym-muted); }

  .gym-container [contenteditable="true"] { border-bottom: 1px dashed var(--gym-muted); outline: none; min-width: 15px; display: inline-block; transition: all 0.2s; color: var(--gym-text); }
  .gym-container [contenteditable="true"]:focus { border-bottom-color: var(--gym-primary); color: var(--gym-primary); background: rgba(0, 230, 118, 0.1); border-radius: 2px; }

  .gym-finish-btn { background: var(--gym-primary); color: var(--gym-bg); border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;}

  /* Timer Settings */
  .gym-timer-container { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--gym-group-1); padding: 12px 10px; border-top: 1px solid var(--gym-border); display: flex; align-items: center; justify-content: space-between; z-index: 3100; box-shadow: 0 -5px 15px rgba(0,0,0,0.5);}
  .gym-timer-display { font-size: 1.8rem; font-weight: bold; font-variant-numeric: tabular-nums; width: 80px; text-align: center; color: var(--gym-text);}
  .gym-timer-display.finished { color: var(--gym-danger); animation: gym-blink 1s infinite; }
  @keyframes gym-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .gym-timer-controls { display: flex; gap: 6px; flex-grow: 1; justify-content: flex-end; }
  .gym-timer-btn { padding: 10px 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; background-color: #333; color: white; min-width: 45px; }
  .gym-timer-btn.preset { background-color: #2c3e50; }
  .gym-timer-btn.stop { background-color: var(--gym-danger); }

  @media (max-width: 600px) {
    body { padding: 4px; padding-top: 60px; overflow-x: hidden; }
    .toolbar { padding: 6px; gap: 4px; }
    select, button { height: 32px; padding: 0 8px; font-size: 11px; }
    .cal-grid { gap: 15px; margin-top: 5px; }
    .month-block { height: calc(100dvh - 70px); display: flex; flex-direction: column; scroll-margin-top: 65px; border-radius: 12px; }
    .month-header { flex: 0 0 auto; padding: 6px; font-size: 15px; }
    .days-header { flex: 0 0 auto; }
    .day-name { padding: 4px 0; font-size: 9px; }
    .week-row { flex: 0 0 26px; }
    .note-row { flex: 1 1 0; min-height: 0; }
    .day-cell { height: 100%; }
    .day-num { font-size: 13px; }
    .note-cell { height: 100%; font-size: 9px; padding: 3px 2px; }
    .today-ring::after { inset: 0px; border-width: 2px; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h2>Smart Calendar</h2>
    <p>Area riservata. Effettua l'accesso.</p>
    <input type="email" id="emailInput" class="login-input" placeholder="La tua Email">
    <input type="password" id="passwordInput" class="login-input" placeholder="Password">
    <button class="login-btn" onclick="login()">Entra</button>
    <div id="loginError" class="error-msg"></div>
  </div>
</div>

<div id="appContent">
  <div class="toolbar" id="mainToolbar">
    <select id="yearSel"></select>
    <button class="today-btn" onclick="scrollToToday()">📅 Oggi</button>
    <button class="today-btn" style="background: var(--primary); color: white;" onclick="showStats()">📊 Riepilogo</button>
    <button class="gym-btn" onclick="openGymOverlay()">🏋️ GYM</button>
    <button onclick="location.reload()" title="Aggiorna">🔄</button>
    <button class="undo-btn" onclick="undo()" title="Torna indietro">↩️</button>
    <button class="logout-btn" onclick="logout()">Esci</button>
  </div>

  <div class="cal-grid" id="calGrid"></div>

  <div class="modal-bg" id="statsOverlay" onclick="if(event.target.id==='statsOverlay') this.classList.remove('active')">
    <div class="modal">
      <h4 style="text-align:center; margin-bottom:15px; color:var(--primary); font-size: 16px;">📋 Riepilogo e Strumenti</h4>
      <div id="statsContent" style="line-height:1.6; font-size:12px; font-weight:500; margin-bottom: 15px; background: var(--bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);"></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px;">
          <button class="btn-save" style="margin-top:0; background: #25D366; font-size: 11px; padding: 10px;" onclick="shareWeek()">📤 Invia</button>
          <button class="btn-save" style="margin-top:0; background: #3498DB; font-size: 11px; padding: 10px;" onclick="showWeather()">🌦️ Meteo</button>
          <button class="btn-save" style="margin-top:0; background: #374151; font-size: 11px; padding: 10px;" onclick="toggleDarkMode()">🌓 Tema</button>
      </div>
      <button class="btn-save" style="background: #E74C3C; padding: 10px; margin-top: 5px;" onclick="document.getElementById('statsOverlay').classList.remove('active')">CHIUDI</button>
    </div>
  </div>

  <div class="modal-bg" id="weatherOverlay" onclick="if(event.target.id==='weatherOverlay') this.classList.remove('active')">
    <div class="modal">
      <h4 style="text-align:center; margin-bottom:15px; color:var(--primary); font-size: 16px;">🌦️ Meteo Locale</h4>
      <div id="weatherContent" style="line-height:1.6; font-size:12px; text-align:left; margin-bottom: 15px;">
         <em>📍 Acquisizione posizione in corso...</em>
      </div>
      <button class="btn-save" style="padding: 10px;" onclick="document.getElementById('weatherOverlay').classList.remove('active')">CHIUDI METEO</button>
    </div>
  </div>

  <div class="modal-bg" id="modal" onclick="if(event.target.id==='modal')cancelModal()">
    <div class="modal">
      <h4 id="modalTitle" style="font-size:16px; font-weight:600; margin-bottom:12px; text-align:center;">Modifica Giorno</h4>
      <div class="color-grid" id="colorGrid"></div>
      <textarea id="modalText" placeholder="Aggiungi dei task..."></textarea>
      <button class="btn-save" onclick="saveAndCloseModal()">FATTO</button>
    </div>
  </div>
</div>

<div id="gymOverlay">
    <div class="gym-header">
        <div class="gym-title-row">
            <h1>Workout Slim</h1>
            <button class="close-gym-btn" onclick="closeGymOverlay()">Chiudi ✖</button>
        </div>
        <div class="gym-tabs">
            <button class="gym-tab-btn active" onclick="switchGymTab('day1')">DAY 1</button>
            <button class="gym-tab-btn" onclick="switchGymTab('day2')">DAY 2</button>
            <button class="gym-tab-btn" onclick="switchGymTab('day3')">DAY 3</button>
            <button onclick="location.reload()" title="Aggiorna">🔄</button>
            <button class="gym-tab-btn" onclick="resetGymData()" style="border-color: #ff5252; color: #ff5252;">Reset</button>
        </div>
    </div>

    <div class="gym-container">
        <div id="gym-day1" class="gym-day-content active"></div>
        <div id="gym-day2" class="gym-day-content"></div>
        <div id="gym-day3" class="gym-day-content"></div>
    </div>

    <div class="gym-timer-container">
        <div class="gym-timer-display" id="timeDisplay">00:00</div>
        <div class="gym-timer-controls">
            <button class="gym-timer-btn preset" onclick="startGymTimer(20)">20s</button>
            <button class="gym-timer-btn preset" onclick="startGymTimer(30)">30s</button>
            <button class="gym-timer-btn preset" onclick="startGymTimer(60)">60s</button>
            <button class="gym-timer-btn preset" onclick="startGymTimer(90)">90s</button>
            <button class="gym-timer-btn stop" onclick="stopGymTimer()">STOP</button>
        </div>
    </div>
    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
</div>

<script>
// Gestione Dark Mode
if (localStorage.getItem('darkMode') === 'true') { document.body.classList.add('dark-mode'); }
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
}

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDeFEGyaHbvTB5GmQwvZ3LCRHEXliWPlE8",
  authDomain: "calendariosmart-4ae27.firebaseapp.com",
  projectId: "calendariosmart-4ae27",
  storageBucket: "calendariosmart-4ae27.firebasestorage.app",
  messagingSenderId: "1027818141525",
  appId: "1:1027818141525:web:b409cbe6c524d532a1a1dc",
  databaseURL: "https://calendariosmart-4ae27-default-rtdb.europe-west1.firebasedatabase.app/"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const database = firebase.database();

let dbRef = null;
let initialLoad = true;
let db = {}; 
let historyStack = []; 
let currentYear = new Date().getFullYear();
let selectedKeys = [];
let isSelecting = false;
let tempBulkColor = null;
let tempBulkText = "";

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    if(!dbRef) {
        dbRef = database.ref('calendario_dati');
        dbRef.on('value', (s) => {
          db = s.val() || {};
          
          // Inizializza Dati Palestra se non esistono nel DB
          if(!db.gym_data) {
             db.gym_data = gymDefaultData;
          }
          
          render();
          initGymData(); // Aggiorna la vista palestra coi dati dal cloud
          
          if (initialLoad) {
             setTimeout(scrollToToday, 300);
             initialLoad = false;
             setupPointerEvents();
          }
        });
    }
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appContent').style.display = 'none';
  }
});

function login() {
  const email = document.getElementById('emailInput').value;
  const pass = document.getElementById('passwordInput').value;
  const errorDiv = document.getElementById('loginError');
  errorDiv.textContent = 'Accesso in corso...';

// Riepilogo Stipendio
function showStats() {
  const now = new Date();
  const m = now.getMonth() + 1;
  const y = now.getFullYear();
  let stats = { MATTINA: 0, POMERIGGIO: 0, SMART: 0, SEDE: 0, FERIE: 0, GYM: 0 };
  let giorniLavoroEffettivi = 0;
  let oreMaggiorazione = 0;
  
  const daysInMonth = new Date(y, m, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
     const dow = new Date(y, m-1, d).getDay();
     const kTop = `${y}-${m}-${d}-top`;
     const kBot = `${y}-${m}-${d}-bottom`;
     
     let topColor = db[kTop]?.color || 'none';
     let botColor = db[kBot]?.color || 'none';
     let text = (db[kBot]?.text || "").toLowerCase();

     // Conta Allenamenti
     if (text.includes('🏋️')) stats.GYM++;
     if (dow === 0 || dow === 6) continue; // Esclude weekend da turni

     if (topColor === 'none') {
         const autoHex = getAutoColor(y, m, d);
         topColor = autoHex === '#D6EAF8' ? 'mattina' : 'pomeriggio';
     }

     let isFerie = (botColor === 'ferie' || text.includes('ferie') || topColor === 'ferie');
     let isFestivita = (botColor === 'festivita' || text.includes('festivita') || topColor === 'festivita');

     if (topColor === 'mattina') stats.MATTINA++;
     if (topColor === 'pomeriggio') stats.POMERIGGIO++;

     if (isFerie) {
         stats.FERIE++;
     } else if (botColor === 'smart' || text.includes('smart')) {
         stats.SMART++;
     } else if (botColor === 'none' || botColor === 'vuoto' || !botColor) {
         stats.SEDE++;
     }
     
     if (!isFerie && !isFestivita) {
         giorniLavoroEffettivi++;
         if (topColor === 'mattina') oreMaggiorazione += 1.5;
         if (topColor === 'pomeriggio') oreMaggiorazione += 1.0;
     }
  }

  const stipendioBase = 3745.20;
  const indennitaTurno = giorniLavoroEffettivi * 8.07692;
  const maggiorazioneTurno = oreMaggiorazione * 8.01595;
  const totaleLordo = stipendioBase + indennitaTurno + maggiorazioneTurno - 180.00;
  const tasse = totaleLordo * 0.375;
  const stipendioNetto = totaleLordo - tasse;

  document.getElementById('statsContent').innerHTML = `
    <div style="display:flex; justify-content:space-between;"><span>☀️ Mattine:</span> <b>${stats.MATTINA}</b></div>
    <div style="display:flex; justify-content:space-between;"><span>🌙 Pomeriggi:</span> <b>${stats.POMERIGGIO}</b></div>
    <div style="display:flex; justify-content:space-between; color:var(--primary);"><span>🏢 In Sede:</span> <b>${stats.SEDE}</b></div>
    <div style="display:flex; justify-content:space-between; color:#E74C3C;"><span>🏠 Smart:</span> <b>${stats.SMART}</b></div>
    <div style="display:flex; justify-content:space-between; color:gray;"><span>🏖️ Ferie:</span> <b>${stats.FERIE}</b></div>
    <div style="display:flex; justify-content:space-between; color:#27AE60;"><span>🏋️ Workout:</span> <b>${stats.GYM}</b></div>
    <hr style="border:0; border-top:1px solid var(--border-color); margin: 8px 0;">
    <div style="text-align:center;">
        💰 <b>Previsione Stipendio:</b><br>
        <span style="font-size:10px; color:gray;">Base: 3745,20€ | Ind: +${indennitaTurno.toFixed(2)}€ | Magg: +${maggiorazioneTurno.toFixed(2)}€</span><br>
        <div style="display: flex; align-items: center; justify-content: center; margin-top: 5px;">
            <span id="stipendioAmount" style="font-size:20px; font-weight:700; color:#27AE60;" data-amount="€ ${stipendioNetto.toFixed(2).replace('.', ',')}">€ ${stipendioNetto.toFixed(2).replace('.', ',')}</span>
            <button onclick="toggleStipendio(this)" style="background:transparent; border:none; box-shadow:none; font-size:18px; cursor:pointer; padding:0; margin-left:8px; height:auto;" title="Nascondi importo">🙈</button>
        </div>
    </div>
  `;
  document.getElementById('statsOverlay').classList.add('active');
}

function toggleStipendio(btn) {
  const el = document.getElementById('stipendioAmount');
  if (el.innerText.includes('***')) {
    el.innerText = el.getAttribute('data-amount');
    btn.innerText = '🙈';
  } else {
    el.innerText = '***,** €';
    btn.innerText = '👁️';
  }
}

function shareWeek() {
  let msg = "📅 *I miei turni della settimana*:\n\n";
  const today = new Date();
  const dayOfWeek = today.getDay() === 0 ? 7 : today.getDay();
  const start = new Date(today);
  start.setDate(today.getDate() - dayOfWeek + 1);

  const giorniNome = ["Lun", "Mar", "Mer", "Gio", "Ven"];
  
  for(let i=0; i<5; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const kTop = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}-top`;
    const kBot = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}-bottom`;
    let topColor = db[kTop]?.color || 'none';
    let botColor = db[kBot]?.color || 'none';
    let text = (db[kBot]?.text || "").toLowerCase();
    
    if (topColor === 'none') {
        const autoHex = getAutoColor(d.getFullYear(), d.getMonth()+1, d.getDate());
        topColor = autoHex === '#D6EAF8' ? 'MATTINA' : 'POMERIGGIO';
    } else {
        topColor = topColor.toUpperCase();
    }

    let luogo = "IN SEDE";
    if (botColor === 'smart' || text.includes('smart')) luogo = "SMART WORKING";
    if (botColor === 'ferie' || text.includes('ferie')) luogo = "FERIE";

    msg += `🔹 ${giorniNome[i]} ${d.getDate()}/${d.getMonth()+1}: *${topColor}* (${luogo})\n`;
  }
  window.open(`whatsapp://send?text=${encodeURIComponent(msg)}`);
}

function showWeather() {
  document.getElementById('statsOverlay').classList.remove('active'); 
  const modal = document.getElementById('weatherOverlay');
  const content = document.getElementById('weatherContent');
  modal.classList.add('active');
  content.innerHTML = "<em>📍 Ricerca posizione in corso...</em>";

  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`);
        const data = await res.json();
        
        let html = "";
        const giorni = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
        
        for(let i=0; i<5; i++) {
           const code = data.daily.weathercode[i];
           const maxT = Math.round(data.daily.temperature_2m_max[i]);
           const minT = Math.round(data.daily.temperature_2m_min[i]);
           let icon = "☀️";
           if(code === 1 || code === 2) icon = "⛅";
           else if(code === 3) icon = "☁️";
           else if(code >= 45 && code <= 48) icon = "🌫️";
           else if(code >= 51 && code <= 67) icon = "🌧️";
           else if(code >= 71 && code <= 77) icon = "❄️";
           else if(code >= 80 && code <= 82) icon = "🌦️";
           else if(code >= 95) icon = "⛈️";
           
           const d = new Date(data.daily.time[i]);
           const dayName = i === 0 ? "Oggi" : i === 1 ? "Domani" : giorni[d.getDay()];

           html += `<div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border-color); padding:8px 0;">
             <span style="width:70px;"><b>${dayName}</b></span>
             <span style="font-size:16px;">${icon}</span>
             <span style="width:80px; text-align:right;">${minT}° / ${maxT}°</span>
           </div>`;
        }
        content.innerHTML = html;
      } catch(e) { content.innerHTML = "<em>❌ Errore meteo.</em>"; }
    }, (error) => { content.innerHTML = "<em>⚠️ Permesso posizione negato.</em>"; });
  } else { content.innerHTML = "<em>Geolocalizzazione non supportata.</em>"; }
}

// Logica di selezione e salvataggio calendario
function setupPointerEvents() {
    const grid = document.getElementById('calGrid');
    const getCell = (x, y) => document.elementFromPoint(x, y)?.closest('.cell:not(.empty)');
    grid.onpointerdown = (e) => {
        const cell = getCell(e.clientX, e.clientY);
        if (!cell) return;
        isSelecting = true;
        selectedKeys = [cell.dataset.key];
        grid.setPointerCapture(e.pointerId);
        cell.classList.add('selected');
    };
    grid.onpointermove = (e) => {
        if (!isSelecting) return;
        const cell = getCell(e.clientX, e.clientY);
        if (cell && !selectedKeys.includes(cell.dataset.key)) {
            selectedKeys.push(cell.dataset.key);
            cell.classList.add('selected');
        }
    };
    grid.onpointerup = (e) => {
        if (!isSelecting) return;
        isSelecting = false;
        grid.releasePointerCapture(e.pointerId);
        openBulkEdit();
    };
}

function openBulkEdit() {
  if(selectedKeys.length === 1) {
      const data = db[selectedKeys[0]] || {};
      tempBulkColor = data.color || 'none';
      tempBulkText = data.text || "";
  } else { tempBulkColor = null; tempBulkText = ""; }
  document.getElementById('modalText').value = tempBulkText;
  renderColors();
  document.getElementById('modal').classList.add('active');
}

function renderColors() {
  document.getElementById('colorGrid').innerHTML = COLORS.map(c => {
    let bgStyle = c.hex === 'none' ? 'var(--card-bg)' : c.hex;
    let textCol = (c.hex === 'none') ? 'var(--text-main)' : (darkBgColors.includes(c.hex) ? '#ffffff' : '#111827');
    const textShadow = darkBgColors.includes(c.hex) ? 'text-shadow: 0 1px 2px rgba(0,0,0,0.3);' : '';
    const border = tempBulkColor===c.id ? '2px solid var(--primary)' : '1px solid var(--border-color)';
    return `<div class="color-opt" style="background:${bgStyle}; border:${border}; color:${textCol}; ${textShadow}" onclick="selectBulkColor('${c.id}', event)">${c.label}</div>`;
  }).join('');
}

function selectBulkColor(id, event) {
  event.stopPropagation();
  
  // Aggiorna tempBulkText con quello che c'è attualmente nella casella di testo
  // (utile per non perdere ciò che potresti aver scritto a mano prima di cliccare)
  tempBulkText = document.getElementById('modalText').value;
  
  const colorObj = COLORS.find(c => c.id === id);
  
  if (!colorObj.isAdd) tempBulkColor = id;
  
  if (id === 'none') { 
      tempBulkText = ''; 
      document.getElementById('modalText').value = ''; 
  } else if (colorObj.autoText) {
      if (colorObj.isAdd) {
          // CONTROLLO: Se il testo NON contiene già la stringa (es. "🚂 8.52"), allora la aggiunge
          if (!tempBulkText.includes(colorObj.autoText)) {
              tempBulkText = tempBulkText ? tempBulkText + "\n" + colorObj.autoText : colorObj.autoText;
          }
      } else {
          // Se non è un tasto additivo, sostituisce il testo
          tempBulkText = colorObj.autoText;
      }
      document.getElementById('modalText').value = tempBulkText;
  }
  
  renderColors();
}

function saveAndCloseModal() {
  const currentTxt = document.getElementById('modalText').value.trim();
  tempBulkText = currentTxt;
  saveState();
  selectedKeys.forEach(k => {
    db[k] = { color: tempBulkColor || (db[k]?.color || 'none'), text: tempBulkText };
    if(db[k].color === 'none' && db[k].text === '') delete db[k];
  });
  pushToCloud();
  document.getElementById('modal').classList.remove('active');
  document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
  selectedKeys = [];
}

function cancelModal() {
  document.getElementById('modal').classList.remove('active');
  document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
  selectedKeys = [];
}

const REF_DATE = new Date(2027, 0, 4);
function getAutoColor(y, m, d) {
  const dt = new Date(y, m-1, d);
  const dow = dt.getDay() === 0 ? 6 : dt.getDay() - 1;
  const mon = new Date(dt); mon.setDate(dt.getDate() - dow);
  const wk = Math.round((mon - REF_DATE) / (1000*60*60*24*7));
  return wk % 2 === 0 ? '#D6EAF8' : '#F5CBA7';
}

function render() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const today = new Date();
  const ty = today.getFullYear(), tm = today.getMonth(), td = today.getDate();
  for(let m=1; m<=12; m++) {
    const daysInM = new Date(currentYear, m, 0).getDate();
    const offset = new Date(currentYear, m-1, 1).getDay() === 0 ? 6 : new Date(currentYear, m-1, 1).getDay() - 1;
    let h = `<div class="month-block" id="m-${currentYear}-${m}">
      <div class="month-header">${MONTHS[m-1]} ${currentYear}</div>
      <div class="days-header">${DAYS.map(d => `<div class="day-name">${d}</div>`).join('')}</div>`;
    let d = 1 - offset;
    while(d <= daysInM) {
      h += `<div class="week-row">`;
      for(let i=0; i<7; i++) {
        let cd = d + i;
        if(cd > 0 && cd <= daysInM) {
          const k = `${currentYear}-${m}-${cd}-top`;
          const isT = currentYear===ty && (m-1)===tm && cd===td;
          const user = db[k] || {};
          let hexCol = user.color && user.color!=='none' ? COLORS.find(c=>c.id===user.color).hex : 'none';
          let bgStyle = hexCol;
          let isWeekend = false;
          if(bgStyle === 'none') {
            const dow = new Date(currentYear, m-1, cd).getDay();
            if (dow===0 || dow===6) { bgStyle = 'var(--weekend-bg)'; isWeekend = true; } 
            else { bgStyle = getAutoColor(currentYear, m, cd); }
          }
          let textCol = (darkBgColors.includes(bgStyle)) ? '#ffffff' : (lightBgColors.includes(bgStyle) ? '#111827' : (isWeekend ? 'var(--weekend-text)' : 'var(--default-text)'));
          const textShadow = darkBgColors.includes(bgStyle) ? 'text-shadow: 0 1px 2px rgba(0,0,0,0.3);' : '';
          h += `<div class="cell day-cell ${isT?'today-ring':''}" style="background:${bgStyle}; color:${textCol}; ${textShadow}" data-key="${k}"><span class="day-num">${cd}</span></div>`;
        } else h += `<div class="cell empty"></div>`;
      }
      h += `</div><div class="note-row">`;
      for(let i=0; i<7; i++) {
        let cd = d + i;
        if(cd > 0 && cd <= daysInM) {
          const k = `${currentYear}-${m}-${cd}-bottom`;
          const user = db[k] || {};
          let hexCol = user.color && user.color!=='none' ? COLORS.find(c=>c.id===user.color).hex : 'none';
          let bgStyle = hexCol;
          let isWeekend = false;
          if (bgStyle === 'none') {
            const dow = new Date(currentYear, m-1, cd).getDay();
            if (dow===0 || dow===6) { bgStyle = 'var(--weekend-bg)'; isWeekend = true; } 
            else { bgStyle = 'var(--default-cell-bg)'; }
          }
          let textCol = (darkBgColors.includes(bgStyle)) ? '#ffffff' : (lightBgColors.includes(bgStyle) ? '#111827' : (isWeekend ? 'var(--weekend-text)' : 'var(--default-text)'));
          const textShadow = darkBgColors.includes(bgStyle) ? 'text-shadow: 0 1px 2px rgba(0,0,0,0.3);' : '';
          const lines = (user.text||'').split('\n').filter(l => l.trim() !== '');
          const htmlTasks = lines.map(l => `<div style="margin-bottom:3px; display:flex; gap:4px;"><span>•</span><span style="flex:1; word-break:break-word;">${l}</span></div>`).join('');
          h += `<div class="cell note-cell" style="background:${bgStyle}; color:${textCol}; ${textShadow}" data-key="${k}">${htmlTasks}</div>`;
        } else h += `<div class="cell empty"></div>`;
      }
      h += `</div>`; d += 7;
    }
    grid.innerHTML += h + `</div>`;
  }
}

function openGymOverlay() { document.getElementById('gymOverlay').classList.add('active'); }
function closeGymOverlay() { document.getElementById('gymOverlay').classList.remove('active'); }

function initGymData() {
    renderGymDay('day1', 'gym-day1');
    renderGymDay('day2', 'gym-day2');
    renderGymDay('day3', 'gym-day3');
}

function saveGymDatiToCloud() {
    saveState();
    pushToCloud();
}

function resetGymData() {
    if(confirm("Vuoi ripristinare la scheda ai valori originali?")) {
        db.gym_data = JSON.parse(JSON.stringify(gymDefaultData));
        saveGymDatiToCloud();
        initGymData();
    }
}

function updateGymField(dayId, groupIndex, exIndex, field, element) {
    db.gym_data[dayId][groupIndex][exIndex][field] = element.innerText;
    saveGymDatiToCloud();
}

function toggleGymDone(itemId) {
    document.getElementById(itemId).classList.toggle('done');
}

function completaAllenamentoOggi(dayLabel) {
    const today = new Date();
    const y = today.getFullYear();
    const m = today.getMonth() + 1;
    const d = today.getDate();
    const kBot = `${y}-${m}-${d}-bottom`;
    if (!db[kBot]) { db[kBot] = { color: 'none', text: '' }; }
    
    // Controlla se c'è già l'emoji, altrimenti l'aggiunge
    if (!db[kBot].text.includes('🏋️')) {
        let nota = `🏋️ (${dayLabel})`;
        db[kBot].text = db[kBot].text ? db[kBot].text + '\n' + nota : nota;
        pushToCloud();
        render();
        // aggiorna il calendario sotto
        alert("Grandi! Allenamento salvato nel calendario di oggi!");
        closeGymOverlay();
        // Reset delle spunte
        document.querySelectorAll('.gym-exercise-item.done').forEach(el => el.classList.remove('done'));
        document.querySelectorAll('.gym-checkbox-wrapper input').forEach(el => el.checked = false);
    } else {
        alert("Hai già un allenamento segnato per oggi!");
    }
}

function renderGymDay(dayId, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    if(!db.gym_data || !db.gym_data[dayId]) return;
    db.gym_data[dayId].forEach((group, gIndex) => {
        let groupHtml = `<div class="gym-exercise-group">`;
        
        if(group.length > 1) {
            const groupType = group.length === 2 ? 'Superserie' : (group.length === 3 ? 'Triserie' : 'Circuito');
            groupHtml += `<div class="gym-group-header">${groupType}</div>`;
        }

        group.forEach((ex, eIndex) => {
            const restVal = ex.rest || "-"; 
            groupHtml += `
                <div class="gym-exercise-item" id="gym-item-${ex.id}">
                    <div class="gym-checkbox-wrapper">
                        <input type="checkbox" id="gym-chk-${ex.id}" onchange="toggleGymDone('gym-item-${ex.id}')">
                        <label for="gym-chk-${ex.id}"></label>
                    </div>
                    <div class="gym-ex-info">
                        <div class="gym-ex-name" contenteditable="true" onblur="updateGymField('${dayId}', ${gIndex}, ${eIndex}, 'name', this)">${ex.name}</div>
                        <div class="gym-ex-stats">
                            <span>Rip: <span contenteditable="true" onblur="updateGymField('${dayId}', ${gIndex}, ${eIndex}, 'reps', this)">${ex.reps}</span></span>
                            <span>Kg: <span contenteditable="true" onblur="updateGymField('${dayId}', ${gIndex}, ${eIndex}, 'weight', this)">${ex.weight}</span></span>
                            <span>Rec: <span contenteditable="true" onblur="updateGymField('${dayId}', ${gIndex}, ${eIndex}, 'rest', this)">${restVal}</span></span>
                        </div>
                    </div>
                </div>
            `;
        });
        groupHtml += `</div>`;
        container.innerHTML += groupHtml;
    });

    // Aggiungo il bottone di fine allenamento alla fine di ogni giorno
    const label = dayId.toUpperCase();
    container.innerHTML += `<button class="gym-finish-btn" onclick="completaAllenamentoOggi('${label}')">🏁 Segna Workout come Fatto Oggi</button>`;
}

function switchGymTab(tabId) {
    document.querySelectorAll('.gym-day-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.gym-tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById('gym-' + tabId).classList.add('active');
    event.target.classList.add('active');
}

// ==========================================
// TIMER PALESTRA (Background & 5 Squilli)
// ==========================================
let gymTimerInterval;
let gymEndTime = 0; // Memorizza l'ora esatta in cui deve finire
const gymDisplay = document.getElementById('timeDisplay');
const gymBeepSound = document.getElementById('beepSound');

// 1. Gestione dei 5 squilli
let beepCount = 0;
gymBeepSound.addEventListener('ended', () => {
    beepCount++;
    if (beepCount < 5) { // Quante volte deve suonare (in totale 5)
        gymBeepSound.play().catch(e => console.log("Audio bloccato", e));
    }
});

function updateGymDisplay(seconds) {
    if (seconds < 0) seconds = 0;
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    gymDisplay.innerText = `${m}:${s}`;
}

function startGymTimer(seconds) {
    clearInterval(gymTimerInterval);
    gymDisplay.classList.remove('finished');

    // 2. TRUCCO AUDIO: Sblocca i permessi del browser al tocco
    gymBeepSound.volume = 0; // Mettiamo muto
    gymBeepSound.play().then(() => {
        gymBeepSound.pause();
        gymBeepSound.currentTime = 0;
        gymBeepSound.volume = 1; // Riportiamo il volume al massimo per dopo
    }).catch(e => console.log("Unlock audio fallito", e));

    // 3. Calcolo del tempo assoluto
    // Salviamo l'orario di sistema attuale + i secondi scelti
    gymEndTime = Date.now() + (seconds * 1000);
    updateGymDisplay(seconds);
    
    // Controlliamo l'orologio ogni 250ms (invece di 1 secondo, per essere più reattivi se riapri l'app)
    gymTimerInterval = setInterval(() => {
        // Calcola i secondi rimanenti veri rispetto all'orologio del telefono
        let gymTimeLeft = Math.ceil((gymEndTime - Date.now()) / 1000);
        
        if (gymTimeLeft <= 0) {
            clearInterval(gymTimerInterval);
            updateGymDisplay(0);
            gymDisplay.classList.add('finished');
            gymDisplay.innerText = "FINE";
            
            // Fai partire l'allarme! Il listener "ended" si occuperà di ripeterlo 5 volte
            beepCount = 0; // Resetta il contatore
            gymBeepSound.currentTime = 0;
            gymBeepSound.play().catch(e => console.log("Audio bloccato dal browser", e));
        } else {
            updateGymDisplay(gymTimeLeft);
        }
    }, 250); 
}

function stopGymTimer() {
    clearInterval(gymTimerInterval);
    updateGymDisplay(0);
    gymDisplay.classList.remove('finished');
    
    // Ferma l'allarme se lo stoppi mentre sta suonando
    gymBeepSound.pause();
    gymBeepSound.currentTime = 0;
    beepCount = 5; // Blocca il loop dei 5 squilli
}
